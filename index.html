<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>汎用ダイヤグラム</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div><div class="brand">RAIL DIAGRAM</div><h1>汎用ダイヤグラム</h1></div>
  <div class="version">ver.05</div>
</header>
<nav class="tabs">
  <button class="tab active" data-view="diagram">ダイヤグラム</button>
  <button class="tab" data-view="stations">駅設定</button>
  <button class="tab" data-view="trains">列車設定</button>
  <button class="tab" data-view="vehicles">車両・運用</button>
</nav>
<main>
<section id="diagram" class="view active">
  <div class="section-head"><div><p class="eyebrow">TIMETABLE GRAPH</p><h2>ダイヤグラム</h2></div><div class="tools"><button id="exportBtn" class="secondary">JSON書き出し</button><label class="secondary filebtn">JSON読み込み<input id="importFile" type="file" accept=".json,application/json"></label><label class="secondary filebtn">.oud読み込み<input id="oudFile" type="file" accept=".oud,.txt,text/plain"></label></div></div>
  <div class="diagram-wrap"><div id="diagramCanvas" class="diagram-canvas"><p class="empty">駅と列車を登録するとダイヤが表示されます。</p></div></div>
</section>
<section id="stations" class="view">
  <div class="section-head"><div><p class="eyebrow">STATION SETTINGS</p><h2>駅設定</h2></div></div>
  <form id="stationForm" class="form-grid"><input id="stationName" placeholder="駅名" required><input id="stationDistance" type="number" min="0" step="0.1" placeholder="起点からの距離 (km)"><button>駅を追加</button></form>
  <div id="stationList" class="list"></div>
</section>
<section id="trains" class="view">
  <div class="section-head"><div><p class="eyebrow">TRAIN SETTINGS</p><h2>列車設定</h2></div></div>
  <form id="trainForm" class="form-grid">
    <input id="trainNumber" placeholder="列車番号" required><input id="trainType" placeholder="種別"><input id="trainDestination" placeholder="行先">
    <input id="trainColor" type="color" value="#006d69" title="線色">
    <select id="trainVehicle"></select><button>列車を追加</button>
  </form>
  <div class="times-editor"><h3>駅ごとの時刻（到着・発車）</h3><div id="timesEditor"></div></div>
  <div id="trainList" class="list"></div>
</section>
<section id="vehicles" class="view">
  <div class="section-head"><div><p class="eyebrow">VEHICLE & OPERATION</p><h2>車両・運用</h2></div></div>
  <form id="vehicleForm" class="form-grid"><input id="vehicleName" placeholder="編成名・車号" required><input id="vehicleMemo" placeholder="メモ"><button>車両を登録</button></form>
  <div id="vehicleList" class="list"></div>
  <form id="operationForm" class="form-grid"><input id="operationName" placeholder="運用番号" required><select id="operationVehicle"></select><button>運用を登録</button></form>
  <div id="operationList" class="list"></div>
</section>
</main>
<footer>汎用ダイヤグラム ver.05 · データはこのブラウザに保存されます</footer>
<script src="app.js"></script>
</body></html>
